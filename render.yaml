services:
  - type: web
    name: ict-maintenance-backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # AI ICT Support — server-side OpenAI integration (blueprint).
      # OPENAI_API_KEY is REQUIRED but is a secret: add it in the Render
      # Dashboard (service -> Environment -> Add a variable named OPENAI_API_KEY).
      # Never commit it to the repo or expose it to the browser.
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: AI_SUPPORT_ENABLED
        value: "true"
