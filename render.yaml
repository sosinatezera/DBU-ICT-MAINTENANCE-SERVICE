# ─────────────────────────────────────────────────────────────
# Render Blueprint — Smart ICT Maintenance Management System
#
# SECURITY NOTICE (IMPORTANT):
# Real credentials are intentionally NOT stored in this file.
# Set the following secrets ONLY in the Render Dashboard
# (service -> Environment). Do NOT commit them to the repository:
#   - MONGO_URI        (MongoDB Atlas connection string)
#   - SESSION_SECRET   (long random string, e.g. `openssl rand -hex 64`)
#   - JWT_SECRET       (long random string, e.g. `openssl rand -hex 64`)
#   - SMTP_USER        (Gmail address that sends the mail)
#   - SMTP_PASSWORD    (16-char Google App Password for that address)
#
# The `sync: false` entries below keep these keys in the blueprint WITHOUT
# a committed value, so deploys never overwrite the dashboard-set secrets.
# Backend startup also fails fast in production if SESSION_SECRET is missing.
#
# WHY THE SECRETS MATTER — the two that break the login flow:
#   * SESSION_SECRET missing  -> the service refuses to start at all.
#   * SMTP_USER / SMTP_PASSWORD missing -> the service starts normally, logs
#     "EMAIL_CONFIGURATION_ERROR - PASSWORD RESET IS DISABLED", and every
#     forgot-password request answers 503. An empty value here is NOT the same
#     as a working email service: set both in the Dashboard before deploying.
#
# NOT a secret, but must be set in the Dashboard for the same reason:
#   * ADMIN_EMAIL missing -> the service starts normally and the login flow works,
#     but the public contact form answers 503 for EVERY visitor because the ICT
#     Admin has no inbox to be notified at. Reported at boot as
#     "CONTACT_FORM_NOTIFICATION_DISABLED".
# ─────────────────────────────────────────────────────────────
services:
  - type: web
    name: dbu-ict-maintenance-service
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Set this to a network-reachable Ollama service URL if AI is enabled.
      # The service URL must be reachable from this Render container.
      - key: OLLAMA_BASE_URL
        sync: false
        value: ""
      - key: OLLAMA_MODEL
        value: llama3.2
      - key: AI_SUPPORT_ENABLED
        value: "true"
      - key: FRONTEND_URL
        value: https://simms-ict-maintenance-system.netlify.app
      - key: FRONTEND_ORIGINS
        value: https://simms-ict-maintenance-system.netlify.app,https://smartcomputer-maintenance-system.netlify.app,https://smartcomputermaintenanceservice.netlify.app
      # Reverse proxy: Render terminates TLS in front of this service, so the
      # socket address is Render's for every caller. Trusting that single hop
      # is what makes per-IP rate limiting work at all. A NUMBER is required —
      # "true" would let a client spoof X-Forwarded-For and escape a rate limit.
      - key: TRUST_PROXY
        value: "1"
      # Email — Gmail SMTP. REQUIRED: password-reset verification codes are the
      # only way a user can recover access, and this endpoint has no fallback
      # channel. Credentials are secrets — set them in the Render Dashboard
      # (service -> Environment); an empty value here disables password reset and
      # is reported at boot as "EMAIL_CONFIGURATION_ERROR". SMTP_PASSWORD must be
      # a Google App Password (see backend/.env.example).
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
        value: ""
      - key: SMTP_PASSWORD
        sync: false
        value: ""
      # ADMIN_EMAIL — the ICT Admin inbox that receives every contact-form
      # submission. The controller emails it and treats a non-delivery as a
      # failed submission, so when it is blank the contact form answers 503 for
      # every visitor even though SMTP is healthy. Reported at boot as
      # "CONTACT_FORM_NOTIFICATION_DISABLED". Not defaulted in code on purpose:
      # set the real inbox in the Render Dashboard (service -> Environment).
      - key: ADMIN_EMAIL
        sync: false
        value: ""
      # Secrets — set in the Render Dashboard, NOT here (see notice above).
      - key: MONGO_URI
        sync: false
        value: ""
      # SESSION_SECRET backs express-session. The startup guard aborts the
      # process in production when it is missing, so it must be declared here.
      - key: SESSION_SECRET
        sync: false
        value: ""
      - key: JWT_SECRET
        sync: false
        value: ""
