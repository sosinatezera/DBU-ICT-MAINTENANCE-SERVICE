<!DOCTYPE html>
<html lang="en">
<script>(function(){try{if(localStorage.getItem('theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
<script>(function(){try{var l=localStorage.getItem('ict_lang');if(l==='am'||l==='en'||l==='om'){document.documentElement.setAttribute('lang',l);}}catch(e){}})();</script>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="page.forgot">Forgot Password — Smart Computer Maintenance Service</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <script src="/assets/js/api-config.js"></script>
</head>
<body class="auth-body">

<div class="min-vh-100 d-flex align-items-center justify-content-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-6 col-lg-5 col-xl-4">

        <div class="card shadow-lg">
          <div class="card-body p-4 p-md-5">

            <!-- Logo -->
            <div class="text-center mb-4">
              <div class="d-inline-flex align-items-center justify-content-center mb-3"
                   style="width:72px;height:72px;background:linear-gradient(135deg,#2563eb,#0a2540);border-radius:18px;box-shadow:0 6px 20px rgba(37,99,235,.35);">
                <svg xmlns="http://www.w3.org/2000/svg" width="42" height="42" viewBox="0 0 64 64" fill="none">
                  <rect x="10" y="12" width="44" height="30" rx="3" fill="#fff" fill-opacity=".2" stroke="#fff" stroke-width="2"/>
                  <rect x="14" y="16" width="36" height="22" rx="2" fill="#fff" fill-opacity=".9"/>
                  <circle cx="32" cy="27" r="6" fill="#2563eb"/>
                  <circle cx="32" cy="27" r="3" fill="#fff"/>
                  <rect x="30.5" y="19" width="3" height="3" rx="1" fill="#2563eb"/>
                  <rect x="30.5" y="33" width="3" height="3" rx="1" fill="#2563eb"/>
                  <rect x="19" y="25.5" width="3" height="3" rx="1" fill="#2563eb"/>
                  <rect x="42" y="25.5" width="3" height="3" rx="1" fill="#2563eb"/>
                  <rect x="28" y="42" width="8" height="5" rx="1" fill="#fff" fill-opacity=".7"/>
                  <rect x="22" y="47" width="20" height="3" rx="1.5" fill="#fff" fill-opacity=".7"/>
                  <path d="M44 46 L50 52 M44 46 C42 44 42 41 44 39 C46 37 49 37 51 39 L48 42 L46 40 L44 42 L46 44 Z" stroke="#fff" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                  <circle cx="14" cy="56" r="2" fill="#4ade80"/>
                  <circle cx="20" cy="56" r="2" fill="#4ade80" opacity=".7"/>
                  <circle cx="26" cy="56" r="2" fill="#fff" opacity=".4"/>
                </svg>
              </div>
              <h4 class="fw-bold mb-1"><span data-i18n="auth.brand">Smart Computer Maintenance Service</span></h4>
              <p class="text-muted small mb-1"><span data-i18n="forgot.title">Forgot Password?</span></p>
              <p class="text-muted small mb-0"><span data-i18n="forgot.subtitle">Enter your registered email address and we'll help you reset your password.</span></p>
            </div>

            <!-- Alert -->
            <div id="forgotAlert" class="alert d-none mb-3" role="alert"></div>

            <form id="forgotForm" novalidate>

              <!-- Email -->
              <div class="mb-3">
                <label for="email" class="form-label fw-semibold small"><span data-i18n="auth.form.email">Email Address</span> <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope text-muted"></i></span>
                  <input type="email" class="form-control" id="email"
                         placeholder="Enter your email address" data-i18n-placeholder="auth.form.email.placeholder"
                         autocomplete="email" required />
                </div>
                <div class="form-text"><span data-i18n="forgot.emailHint">We'll send a secure reset link to this address.</span></div>
              </div>

              <!-- Submit -->
              <button type="submit" class="btn btn-primary w-100 py-2" id="forgotBtn">
                <span id="forgotSpinner" class="spinner-border spinner-border-sm me-2 d-none"></span>
                <i class="bi bi-envelope-arrow-up me-1" id="forgotIcon"></i>
                <span id="forgotBtnText" data-i18n="forgot.send">Send Reset Link</span>
              </button>

            </form>

            <hr class="my-4" />
            <p class="text-center text-muted small mb-0">
              <a href="login.html" class="text-primary fw-semibold text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i><span data-i18n="forgot.backLogin">Back to Login</span>
              </a>
            </p>

          </div>
        </div>

        <footer class="auth-footer">
          <a href="index.html" class="back-home">
            <i class="bi bi-arrow-left"></i><span data-i18n="auth.backhome">Back to Home</span>
          </a>
        </footer>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/validation.js?v=6"></script>
<script>
/* API base comes from the shared api-config.js (single source of truth). */
const API = typeof API_BASE === 'string' ? API_BASE : 'http://localhost:5000/api';

function showAlert(msg, type) {
  const el    = document.getElementById('forgotAlert');
  const icons = {
    success: 'bi-check-circle-fill',
    danger:  'bi-exclamation-triangle-fill',
    warning: 'bi-exclamation-triangle-fill',
    info:    'bi-info-circle-fill',
  };
  el.className = `alert alert-${type} d-flex align-items-center gap-2`;
  el.innerHTML = `<i class="bi ${icons[type] || 'bi-info-circle-fill'} flex-shrink-0"></i><span>${msg}</span>`;
  el.classList.remove('d-none');
}

function setLoading(on) {
  document.getElementById('forgotBtn').disabled = on;
  document.getElementById('forgotSpinner').classList.toggle('d-none', !on);
  document.getElementById('forgotIcon').classList.toggle('d-none', on);
  const text = on
    ? (window.t ? t('forgot.sending') : 'Sending...')
    : (window.t ? t('forgot.send') : 'Send Reset Link');
  document.getElementById('forgotBtnText').textContent = text;
}

/* Real-time field validation */
attachRealTimeValidation('forgotForm', [
  { fieldId: 'email', checks: [Validators.email] },
]);

/* Form submit */
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  document.getElementById('forgotAlert').classList.add('d-none');

  const email = document.getElementById('email').value.trim();

  const emailErr = Validators.email(email);
  if (emailErr) { showFieldError('email', emailErr); return; }
  showFieldValid('email');

  setLoading(true);
  let res;
  try {
    res = await fetch(`${API}/auth/forgot-password`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ email }),
    });
  } catch {
    showAlert('Cannot connect to server. Make sure the backend is running on port 5000.', 'warning');
    setLoading(false);
    return;
  }

  const data = await res.json().catch(() => ({}));

  if (!res.ok) {
    /* 422 = invalid email format; 429 = rate limited. Never a "no such email"
       message, so account existence is never revealed. */
    showAlert(data.message || (res.status === 429 ? 'Too many requests. Please try again later.' : 'Something went wrong. Please try again.'), 'danger');
    setLoading(false);
    return;
  }

  showAlert(data.message || (window.t ? t('forgot.sent') : 'If an account exists for this email, a password reset link has been sent.'), 'success');
  document.getElementById('email').value = '';
  document.getElementById('email').blur();
  setLoading(false);
});
</script>
<script src="/assets/js/theme.js"></script>
<script src="/assets/js/lang.js?v=9"></script>
</body>
</html>
