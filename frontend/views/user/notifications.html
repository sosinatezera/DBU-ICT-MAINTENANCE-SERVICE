<!DOCTYPE html>
<html lang="en">
<script>(function(){try{var l=localStorage.getItem('ict_lang');if(l==='am'||l==='en'){document.documentElement.setAttribute('lang',l);}}catch(e){}})();</script>
<script>(function(){try{if(localStorage.getItem('theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — Smart Computer Maintenance Service</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
<link rel="stylesheet" href="/assets/css/theme.css" />
</head>
<body class="dashboard-body">

  <div class="d-flex">
    <nav id="sidebar" class="sidebar bg-dark text-white d-flex flex-column p-3" style="min-height:100vh;width:240px;">
      <a href="../index.html" class="text-decoration-none">
        <div class="sidebar-brand mb-4 text-center">
          <i class="bi bi-tools fs-3"></i>
          <div class="small fw-bold mt-1">Smart Computer Maintenance</div>
        </div>
      </a>
      <ul class="nav flex-column gap-1">
        <li><a href="dashboard.html"     class="nav-link text-white-50"><i class="bi bi-speedometer2 me-2"></i><span data-i18n="side.dashboard">Dashboard</span></a></li>
        <li><a href="request.html"       class="nav-link text-white-50"><i class="bi bi-plus-circle me-2"></i><span data-i18n="side.new">New Request</span></a></li>
        <li><a href="tracking.html"      class="nav-link text-white-50"><i class="bi bi-search me-2"></i><span data-i18n="side.track">Track Request</span></a></li>
        <li><a href="history.html"       class="nav-link text-white-50"><i class="bi bi-clock-history me-2"></i><span data-i18n="side.history">History</span></a></li>
        <li><a href="notifications.html" class="nav-link text-white active bg-white bg-opacity-25 rounded"><i class="bi bi-bell me-2"></i><span data-i18n="side.notifications">Notifications</span></a></li>
        <li><a href="feedback.html"      class="nav-link text-white-50"><i class="bi bi-star me-2"></i><span data-i18n="side.feedback">Feedback</span></a></li>
        <li><a href="profile.html" class="nav-link text-white-50" id="profileNavLink"><i
              class="bi bi-person-circle me-2"></i><span data-i18n="side.profile">My Profile</span></a></li>
      </ul>
      <div class="mt-auto pt-3 border-top border-white border-opacity-25">
        <a href="#" class="nav-link text-white-50 small" id="logoutBtn"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
      </div>
    </nav>

    <div class="flex-grow-1">
      <header class="topbar bg-white border-bottom px-4 py-3 d-flex justify-content-between align-items-center shadow-sm">
        <div>
          <h5 class="mb-0 fw-bold"><span data-i18n="page.notifications">Notifications</span></h5>
          <small class="text-muted" id="unreadCount"></small>
        </div>
        <div class="d-flex align-items-center gap-3">
          <div class="form-check form-switch m-0">
            <input class="form-check-input" type="checkbox" id="filterUnread" role="switch" />
            <label class="form-check-label small" for="filterUnread">Unread only</label>
          </div>
          <button class="btn btn-sm btn-outline-secondary" id="markAllReadBtn">
            <i class="bi bi-check2-all me-1"></i>Mark All as Read
          </button>
        </div>
      </header>

      <main class="p-4">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div id="notificationsList">
              <div class="text-center text-muted py-5">
                <i class="bi bi-bell fs-1 d-block mb-2"></i>Loading notifications...
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api-config.js"></script>
  <script src="/assets/js/main.js?v=7"></script>
  <script src="/assets/js/notifications.js?v=7"></script>
  <script src="/assets/js/theme.js"></script>
</body>
</html>
