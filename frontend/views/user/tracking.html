<!DOCTYPE html>
<html lang="en">
<script>(function(){try{if(localStorage.getItem('theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Request — Smart Computer Maintenance Service</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
  <style>
    /* Skeleton shimmer used ONLY while the real API request is in flight */
    @keyframes tkShimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
    .tk-skeleton-line {
      border-radius: 4px;
      background: linear-gradient(90deg, #e9ecef 25%, #f5f6f8 37%, #e9ecef 63%);
      background-size: 400% 100%;
      animation: tkShimmer 1.2s ease-in-out infinite;
    }
  </style>
<link rel="stylesheet" href="/assets/css/theme.css" />
</head>
<body class="dashboard-body">

  <div class="d-flex">
    <nav id="sidebar" class="sidebar bg-dark text-white d-flex flex-column p-3" style="min-height:100vh;width:240px;">
      <a href="../index.html" class="text-decoration-none">
        <div class="sidebar-brand mb-4 text-center">
          <i class="bi bi-tools fs-3"></i>
          <div class="small fw-bold mt-1">Smart Computer Maintenance</div>
        </div>
      </a>
      <ul class="nav flex-column gap-1">
        <li><a href="dashboard.html"     class="nav-link text-white-50"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
        <li><a href="request.html"       class="nav-link text-white-50"><i class="bi bi-plus-circle me-2"></i>New Request</a></li>
        <li><a href="tracking.html"      class="nav-link text-white active bg-white bg-opacity-25 rounded"><i class="bi bi-search me-2"></i>Track Request</a></li>
        <li><a href="history.html"       class="nav-link text-white-50"><i class="bi bi-clock-history me-2"></i>History</a></li>
        <li><a href="notifications.html" class="nav-link text-white-50"><i class="bi bi-bell me-2"></i>Notifications</a></li>
        <li><a href="feedback.html"      class="nav-link text-white-50"><i class="bi bi-star me-2"></i>Feedback</a></li>
      </ul>
      <div class="mt-auto pt-3 border-top border-white border-opacity-25">
        <a href="#" class="nav-link text-white-50 small" id="logoutBtn"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
      </div>
    </nav>

    <div class="flex-grow-1">
      <header class="topbar bg-white border-bottom px-4 py-3 d-flex align-items-center justify-content-between shadow-sm">
        <h5 class="mb-0 fw-bold">Track My Requests</h5>
      </header>

      <main class="p-4">
        <!-- Search / Filter Toolbar -->
        <div class="card border-0 shadow-sm mb-4">
          <div class="card-body p-3">
            <div class="row g-2 align-items-end">
              <div class="col-12 col-md-4">
                <label class="form-label small fw-semibold" for="searchInput">Search Requests</label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                  <input type="text" class="form-control" id="searchInput"
                         placeholder="Search by ID, title, device or description..." />
                </div>
              </div>
              <div class="col-6 col-md-2">
                <label class="form-label small fw-semibold" for="statusFilter">Status</label>
                <select class="form-select" id="statusFilter">
                  <option value="">All Statuses</option>
                  <option value="submitted">Submitted</option>
                  <option value="under_review">Under Review</option>
                  <option value="assigned">Assigned</option>
                  <option value="accepted">Accepted</option>
                  <option value="in_progress">In Progress</option>
                  <option value="resolved">Resolved</option>
                  <option value="closed">Closed</option>
                </select>
              </div>
              <div class="col-6 col-md-2">
                <label class="form-label small fw-semibold" for="priorityFilter">Priority</label>
                <select class="form-select" id="priorityFilter">
                  <option value="">All Priorities</option>
                  <option value="low">Low</option>
                  <option value="medium">Medium</option>
                  <option value="high">High</option>
                  <option value="critical">Critical</option>
                </select>
              </div>
              <div class="col-6 col-md-2">
                <label class="form-label small fw-semibold" for="sortFilter">Sort By</label>
                <select class="form-select" id="sortFilter">
                  <option value="newest">Newest First</option>
                  <option value="oldest">Oldest First</option>
                </select>
              </div>
              <div class="col-6 col-md-2">
                <button class="btn btn-primary w-100" id="searchBtn">
                  <i class="bi bi-search me-1"></i>Search
                </button>
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
              <span class="text-muted small"><i class="bi bi-box2 me-1"></i>Showing <strong id="trackingCount">0</strong> request(s)</span>
              <button class="btn btn-outline-secondary btn-sm d-none" id="clearFiltersBtn">
                <i class="bi bi-arrow-counterclockwise me-1"></i>Clear filters
              </button>
            </div>
          </div>
        </div>

        <!-- Requests List -->
        <div id="requestsList" class="row g-3" aria-live="polite">
          <div class="col-12">
            <div class="row g-3">
              <div class="col-md-6 col-lg-4">
                <div class="card border-0 shadow-sm h-100 p-3">
                  <div class="tk-skeleton-line mb-2" style="height:14px;width:45%;"></div>
                  <div class="tk-skeleton-line mb-2" style="height:16px;width:80%;"></div>
                  <div class="tk-skeleton-line mb-2" style="height:12px;width:60%;"></div>
                  <div class="tk-skeleton-line mb-3" style="height:14px;width:30%;"></div>
                  <div class="tk-skeleton-line" style="height:34px;width:100%;"></div>
                </div>
              </div>
              <div class="col-md-6 col-lg-4">
                <div class="card border-0 shadow-sm h-100 p-3">
                  <div class="tk-skeleton-line mb-2" style="height:14px;width:55%;"></div>
                  <div class="tk-skeleton-line mb-2" style="height:16px;width:70%;"></div>
                  <div class="tk-skeleton-line mb-2" style="height:12px;width:65%;"></div>
                  <div class="tk-skeleton-line mb-3" style="height:14px;width:40%;"></div>
                  <div class="tk-skeleton-line" style="height:34px;width:100%;"></div>
                </div>
              </div>
              <div class="col-md-6 col-lg-4">
                <div class="card border-0 shadow-sm h-100 p-3">
                  <div class="tk-skeleton-line mb-2" style="height:14px;width:40%;"></div>
                  <div class="tk-skeleton-line mb-2" style="height:16px;width:85%;"></div>
                  <div class="tk-skeleton-line mb-2" style="height:12px;width:55%;"></div>
                  <div class="tk-skeleton-line mb-3" style="height:14px;width:35%;"></div>
                  <div class="tk-skeleton-line" style="height:34px;width:100%;"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Request Detail Modal -->
        <div class="modal fade" id="requestDetailModal" tabindex="-1" aria-labelledby="requestDetailModalLabel" aria-hidden="true">
          <div class="modal-dialog modal-lg">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title fw-bold" id="requestDetailModalLabel">Request Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body" id="requestDetailBody">
                <div class="text-center py-4"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>
              </div>
              <div class="modal-footer">
                <!-- Status Timeline -->
                <div class="w-100">
                  <h6 class="fw-semibold mb-3">Status Timeline</h6>
                  <div id="statusTimeline" class="d-flex flex-wrap gap-2"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/main.js?v=6"></script>
  <script src="/assets/js/requests.js?v=6"></script>
<script src="/assets/js/theme.js"></script>
</body>
</html>
