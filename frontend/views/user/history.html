<!DOCTYPE html>
<html lang="en">
<script>(function(){try{var l=localStorage.getItem('ict_lang');if(l==='am'||l==='en'){document.documentElement.setAttribute('lang',l);}}catch(e){}})();</script>
<script>(function(){try{if(localStorage.getItem('theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maintenance History — Smart Computer Maintenance Service</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
<link rel="stylesheet" href="/assets/css/theme.css" />
</head>
<body class="dashboard-body">

  <div class="d-flex">
    <nav id="sidebar" class="sidebar bg-dark text-white d-flex flex-column p-3" style="min-height:100vh;width:240px;">
      <a href="../index.html" class="text-decoration-none">
        <div class="sidebar-brand mb-4 text-center">
          <i class="bi bi-tools fs-3"></i>
          <div class="small fw-bold mt-1">Smart Computer Maintenance</div>
        </div>
      </a>
      <ul class="nav flex-column gap-1">
        <li><a href="dashboard.html"     class="nav-link text-white-50"><i class="bi bi-speedometer2 me-2"></i><span data-i18n="side.dashboard">Dashboard</span></a></li>
        <li><a href="request.html"       class="nav-link text-white-50"><i class="bi bi-plus-circle me-2"></i><span data-i18n="side.new">New Request</span></a></li>
        <li><a href="tracking.html"      class="nav-link text-white-50"><i class="bi bi-search me-2"></i><span data-i18n="side.track">Track Request</span></a></li>
        <li><a href="history.html"       class="nav-link text-white active bg-white bg-opacity-25 rounded"><i class="bi bi-clock-history me-2"></i><span data-i18n="side.history">History</span></a></li>
        <li><a href="notifications.html" class="nav-link text-white-50"><i class="bi bi-bell me-2"></i><span data-i18n="side.notifications">Notifications</span></a></li>
        <li><a href="feedback.html"      class="nav-link text-white-50"><i class="bi bi-star me-2"></i><span data-i18n="side.feedback">Feedback</span></a></li>
        <li><a href="profile.html" class="nav-link text-white-50" id="profileNavLink"><i
              class="bi bi-person-circle me-2"></i><span data-i18n="side.profile">My Profile</span></a></li>
      </ul>
      <div class="mt-auto pt-3 border-top border-white border-opacity-25">
        <div class="d-flex align-items-center gap-2 mb-2">
          <i class="bi bi-person-circle fs-5"></i>
          <span class="small" id="sidebarUserName" class="text-white-50"></span>
        </div>
        <a href="#" class="nav-link text-white-50 small" id="logoutBtn">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </a>
      </div>
    </nav>

    <div class="flex-grow-1">
      <header class="topbar bg-white border-bottom px-4 py-3 d-flex align-items-center justify-content-between shadow-sm">
        <h5 class="mb-0 fw-bold">Maintenance History</h5>
        <div class="d-flex align-items-center gap-3">
        </div>
      </header>

      <main class="p-4">
        <!-- Filter Bar -->
        <div class="card border-0 shadow-sm mb-4">
          <div class="card-body p-3">
            <div class="row g-2 align-items-end">
              <div class="col-md-4">
                <label class="form-label small fw-semibold">Date From</label>
                <input type="date" class="form-control" id="dateFrom" />
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold">Date To</label>
                <input type="date" class="form-control" id="dateTo" />
              </div>
              <div class="col-md-2">
                <button class="btn btn-primary w-100" id="filterBtn">
                  <i class="bi bi-funnel me-1"></i>Filter
                </button>
              </div>
              <div class="col-md-2">
                <button class="btn btn-outline-secondary w-100" id="exportBtn">
                  <i class="bi bi-download me-1"></i>Export
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- History Table -->
        <div class="card border-0 shadow-sm">
          <div class="card-header bg-white py-3">
            <h6 class="mb-0 fw-bold">All Request History</h6>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead class="table-light">
                  <tr>
                    <th>#ID</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Technician</th>
                    <th>Last Updated</th>
                    <th>Rating</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="historyTableBody">
                  <tr><td colspan="8" class="text-center text-muted py-4">Loading history...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Request Detail Modal -->
  <div class="modal fade" id="requestDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold">Request Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-0" id="requestDetailBody"></div>
        <div class="modal-footer border-0 flex-column align-items-start">
          <div class="w-100">
            <div class="small fw-semibold text-muted mb-2">STATUS TIMELINE</div>
            <div id="statusTimeline" class="d-flex align-items-center flex-wrap gap-1"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api-config.js"></script>
  <script src="/assets/js/main.js?v=7"></script>
  <script src="/assets/js/requests.js?v=8"></script>
  <script src="/assets/js/theme.js"></script>
</body>
</html>
