<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback — Smart Computer Maintenance Service</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body class="dashboard-body">

  <div class="d-flex">
    <nav id="sidebar" class="sidebar bg-primary text-white d-flex flex-column p-3" style="min-height:100vh;width:240px;">
      <a href="../index.html" class="text-decoration-none">
        <div class="sidebar-brand mb-4 text-center">
          <i class="bi bi-tools fs-3"></i>
          <div class="small fw-bold mt-1">Smart Computer Maintenance</div>
        </div>
      </a>
      <ul class="nav flex-column gap-1">
        <li><a href="dashboard.html"     class="nav-link text-white-50"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
        <li><a href="request.html"       class="nav-link text-white-50"><i class="bi bi-plus-circle me-2"></i>New Request</a></li>
        <li><a href="tracking.html"      class="nav-link text-white-50"><i class="bi bi-search me-2"></i>Track Request</a></li>
        <li><a href="history.html"       class="nav-link text-white-50"><i class="bi bi-clock-history me-2"></i>History</a></li>
        <li><a href="notifications.html" class="nav-link text-white-50"><i class="bi bi-bell me-2"></i>Notifications</a></li>
        <li><a href="feedback.html"      class="nav-link text-white active bg-white bg-opacity-25 rounded"><i class="bi bi-star me-2"></i>Feedback</a></li>
      </ul>
      <div class="mt-auto pt-3 border-top border-white border-opacity-25">
        <a href="#" class="nav-link text-white-50 small" id="logoutBtn"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
      </div>
    </nav>

    <div class="flex-grow-1">
      <header class="topbar bg-white border-bottom px-4 py-3 shadow-sm">
        <h5 class="mb-0 fw-bold">Submit Feedback</h5>
      </header>

      <main class="p-4">
        <div class="row justify-content-center">
          <div class="col-lg-7">

            <!-- Pending Feedback Requests -->
            <div class="card border-0 shadow-sm mb-4">
              <div class="card-header bg-white py-3">
                <h6 class="mb-0 fw-bold"><i class="bi bi-list-check text-primary me-2"></i>Requests Awaiting Feedback</h6>
              </div>
              <div class="card-body p-0">
                <div id="pendingFeedbackList">
                  <div class="text-center text-muted py-4">Loading...</div>
                </div>
              </div>
            </div>

            <!-- Feedback Form -->
            <div class="card border-0 shadow-sm" id="feedbackFormCard" style="display:none!important;">
              <div class="card-header bg-white py-3">
                <h6 class="mb-0 fw-bold"><i class="bi bi-star text-warning me-2"></i>Rate Your Experience</h6>
              </div>
              <div class="card-body p-4">
                <div id="feedbackAlert" class="alert d-none" role="alert"></div>

                <form id="feedbackForm" novalidate>
                  <input type="hidden" id="feedbackRequestId" />

                  <div class="mb-3">
                    <label class="form-label fw-semibold">Request</label>
                    <input type="text" class="form-control" id="feedbackRequestTitle" readonly />
                  </div>

                  <!-- Star Rating -->
                  <div class="mb-3">
                    <label class="form-label fw-semibold">Rating <span class="text-danger">*</span></label>
                    <div class="star-rating d-flex gap-2 fs-2" id="starRating" role="group" aria-label="Rating">
                      <i class="bi bi-star text-warning star" data-value="1" style="cursor:pointer;" tabindex="0" role="radio" aria-label="1 star"></i>
                      <i class="bi bi-star text-warning star" data-value="2" style="cursor:pointer;" tabindex="0" role="radio" aria-label="2 stars"></i>
                      <i class="bi bi-star text-warning star" data-value="3" style="cursor:pointer;" tabindex="0" role="radio" aria-label="3 stars"></i>
                      <i class="bi bi-star text-warning star" data-value="4" style="cursor:pointer;" tabindex="0" role="radio" aria-label="4 stars"></i>
                      <i class="bi bi-star text-warning star" data-value="5" style="cursor:pointer;" tabindex="0" role="radio" aria-label="5 stars"></i>
                    </div>
                    <input type="hidden" id="ratingValue" required />
                    <div class="form-text" id="ratingLabel">Click a star to rate</div>
                  </div>

                  <!-- Comment -->
                  <div class="mb-4">
                    <label for="comment" class="form-label fw-semibold">Comment (Optional)</label>
                    <textarea class="form-control" id="comment" rows="4"
                              placeholder="Share your experience with the maintenance service..."></textarea>
                  </div>

                  <button type="submit" class="btn btn-primary px-4" id="feedbackSubmitBtn">
                    <span class="spinner-border spinner-border-sm me-2 d-none" id="feedbackSpinner"></span>
                    <i class="bi bi-send me-1"></i>Submit Feedback
                  </button>
                </form>
              </div>
            </div>

          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/requests.js"></script>
</body>
</html>
