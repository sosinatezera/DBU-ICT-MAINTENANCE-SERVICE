<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICT Asset Management � Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/admin.css" />
</head>
<body class="dashboard-body">

  <div class="d-flex">
    <nav id="sidebar" class="sidebar bg-dark text-white d-flex flex-column p-3" style="min-height:100vh;width:250px;">
      <a href="../index.html" class="text-decoration-none">
        <div class="sidebar-brand mb-4 text-center">
          <i class="bi bi-shield-check fs-3 text-info"></i>
          <div class="small fw-bold mt-1" id="panelLabel">Management Panel</div>
        </div>
      </a>
      <ul class="nav flex-column gap-1">
        <li><a href="dashboard.html"   class="nav-link text-white-50"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
        <li><a href="users.html"       class="nav-link text-white-50"><i class="bi bi-people me-2"></i>Users</a></li>
        <li><a href="technicians.html" class="nav-link text-white-50"><i class="bi bi-wrench me-2"></i>Technicians</a></li>
        <li><a href="assets.html"      class="nav-link text-white active bg-white bg-opacity-25 rounded"><i class="bi bi-pc-display me-2"></i>ICT Assets</a></li>
        <li><a href="requests.html"    class="nav-link text-white-50"><i class="bi bi-clipboard-check me-2"></i>Requests</a></li>
        <li><a href="categories.html"  class="nav-link text-white-50"><i class="bi bi-tags me-2"></i>Categories</a></li>
        <li><a href="reports.html"     class="nav-link text-white-50"><i class="bi bi-bar-chart-line me-2"></i>Reports</a></li>
        <li><a href="notifications.html" class="nav-link text-white-50"><i class="bi bi-bell me-2"></i>Notifications</a></li>
        <li><a href="settings.html"    class="nav-link text-white-50"><i class="bi bi-gear me-2"></i>Settings</a></li>
      </ul>
      <div class="mt-auto pt-3 border-top border-white border-opacity-25">
        <a href="#" class="nav-link text-white-50 small" id="logoutBtn"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
      </div>
    </nav>

    <div class="flex-grow-1">
      <header class="topbar bg-white border-bottom px-4 py-3 d-flex justify-content-between align-items-center shadow-sm">
        <h5 class="mb-0 fw-bold">ICT Asset Management</h5>
        <div class="d-flex align-items-center gap-2">
          <div id="notifBellContainer"></div>
          <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#assetModal" id="addAssetBtn">
            <i class="bi bi-plus-circle me-1"></i>Add Asset
          </button>
        </div>
      </header>

      <main class="p-4">
        <!-- Filter -->
        <div class="card border-0 shadow-sm mb-4">
          <div class="card-body p-3">
            <div class="row g-2 align-items-end">
              <div class="col-md-4">
                <input type="text" class="form-control" id="searchInput" placeholder="Search by name or tag..." />
              </div>
              <div class="col-md-3">
                <select class="form-select" id="categoryFilter">
                  <option value="">All Categories</option>
                  <option value="Computer">Computer</option>
                  <option value="Printer">Printer</option>
                  <option value="Network">Network Equipment</option>
                  <option value="Server">Server</option>
                  <option value="Peripheral">Peripheral</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="col-md-3">
                <select class="form-select" id="statusFilter">
                  <option value="">All Statuses</option>
                  <option value="active">Active</option>
                  <option value="under_maintenance">Under Maintenance</option>
                  <option value="decommissioned">Decommissioned</option>
                </select>
              </div>
              <div class="col-md-2">
                <button class="btn btn-primary w-100" id="searchBtn"><i class="bi bi-search me-1"></i>Search</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Assets Table -->
        <div class="card border-0 shadow-sm">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead class="table-light">
                  <tr>
                    <th>#</th><th>Asset Name</th><th>Tag</th><th>Category</th>
                    <th>Department</th><th>Location</th><th>Status</th><th>Warranty</th><th>Actions</th>
                  </tr>
                </thead>
                <tbody id="assetsTableBody">
                  <tr><td colspan="9" class="text-center text-muted py-4">Loading assets...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add / Edit Asset Modal -->
  <div class="modal fade" id="assetModal" tabindex="-1" aria-labelledby="assetModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="assetModalLabel">Add New Asset</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="assetModalAlert" class="alert d-none" role="alert"></div>
          <form id="assetForm" novalidate>
            <input type="hidden" id="assetId" />
            <div class="row g-3">
              <div class="col-md-6">
                <label for="assetName" class="form-label fw-semibold">Asset Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="assetName" required />
              </div>
              <div class="col-md-6">
                <label for="assetTag" class="form-label fw-semibold">Asset Tag <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="assetTag" placeholder="e.g. ICT-2024-001" required />
              </div>
              <div class="col-md-6">
                <label for="assetCategory" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                <select class="form-select" id="assetCategory" required>
                  <option value="">-- Select --</option>
                  <option value="Computer">Computer</option>
                  <option value="Printer">Printer</option>
                  <option value="Network">Network Equipment</option>
                  <option value="Server">Server</option>
                  <option value="Peripheral">Peripheral</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="assetStatus" class="form-label fw-semibold">Status</label>
                <select class="form-select" id="assetStatus">
                  <option value="active">Active</option>
                  <option value="under_maintenance">Under Maintenance</option>
                  <option value="decommissioned">Decommissioned</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="assetDepartment" class="form-label fw-semibold">Department</label>
                <input type="text" class="form-control" id="assetDepartment" />
              </div>
              <div class="col-md-6">
                <label for="assetLocation" class="form-label fw-semibold">Location</label>
                <input type="text" class="form-control" id="assetLocation" placeholder="e.g. Room 205, Building A" />
              </div>
              <div class="col-md-6">
                <label for="purchaseDate" class="form-label fw-semibold">Purchase Date</label>
                <input type="date" class="form-control" id="purchaseDate" />
              </div>
              <div class="col-md-6">
                <label for="warrantyExpiry" class="form-label fw-semibold">Warranty Expiry</label>
                <input type="date" class="form-control" id="warrantyExpiry" />
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveAssetBtn">
            <span class="spinner-border spinner-border-sm me-2 d-none" id="saveAssetSpinner"></span>
            Save Asset
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/notifications.js"></script>
  <script src="/assets/js/assets.js"></script>
</body>
</html>
