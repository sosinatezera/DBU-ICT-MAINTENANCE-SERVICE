<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/admin.css" />
  <style>
    .notif-item { transition: background .15s, border-color .15s; }
    .notif-item:hover { background: #f8f9fa !important; }
    .notif-item.unread { background: #fff; }
  </style>
</head>
<body class="dashboard-body">

  <div class="d-flex">
    <!-- ── Sidebar ── -->
    <nav id="sidebar" class="sidebar bg-dark text-white d-flex flex-column p-3" style="min-height:100vh;width:250px;">
      <a href="../index.html" class="text-decoration-none">
        <div class="sidebar-brand mb-4 text-center">
          <i class="bi bi-shield-check fs-3 text-info"></i>
          <div class="small fw-bold mt-1" id="panelLabel">Management Panel</div>
        </div>
      </a>
      <ul class="nav flex-column gap-1">
        <li><a href="dashboard.html"     class="nav-link text-white-50"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
        <li><a href="users.html"         class="nav-link text-white-50"><i class="bi bi-people me-2"></i>Users</a></li>
        <li><a href="technicians.html"   class="nav-link text-white-50"><i class="bi bi-wrench me-2"></i>Technicians</a></li>
        <li><a href="assets.html"        class="nav-link text-white-50"><i class="bi bi-pc-display me-2"></i>ICT Assets</a></li>
        <li><a href="requests.html"      class="nav-link text-white-50"><i class="bi bi-clipboard-check me-2"></i>Requests</a></li>
        <li><a href="categories.html"    class="nav-link text-white-50"><i class="bi bi-tags me-2"></i>Categories</a></li>
        <li><a href="reports.html"       class="nav-link text-white-50"><i class="bi bi-bar-chart-line me-2"></i>Reports</a></li>
        <li><a href="notifications.html" class="nav-link text-white active bg-white bg-opacity-25 rounded">
          <i class="bi bi-bell me-2"></i>Notifications
          <span class="badge bg-danger ms-1" id="sidebarNotifBadge" style="display:none;"></span>
        </a></li>
        <li><a href="settings.html"      class="nav-link text-white-50"><i class="bi bi-gear me-2"></i>Settings</a></li>
      </ul>
      <div class="mt-auto pt-3 border-top border-white border-opacity-25">
        <div class="d-flex align-items-center gap-2 mb-2">
          <i class="bi bi-person-circle fs-5 text-info"></i>
          <span class="small" id="sidebarUserName">Administrator</span>
        </div>
        <a href="#" class="nav-link text-white-50 small" id="logoutBtn">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </a>
      </div>
    </nav>

    <!-- ── Main ── -->
    <div class="flex-grow-1">
      <header class="topbar bg-white border-bottom px-4 py-3 d-flex justify-content-between align-items-center shadow-sm">
        <div>
          <h5 class="mb-0 fw-bold"><i class="bi bi-bell text-primary me-2"></i>Notifications</h5>
          <small class="text-muted" id="unreadCount"></small>
        </div>
        <div class="d-flex align-items-center gap-2">
          <!-- Filter unread toggle -->
          <div class="form-check form-switch mb-0 me-2">
            <input class="form-check-input" type="checkbox" id="filterUnread" />
            <label class="form-check-label small text-muted" for="filterUnread">Unread only</label>
          </div>
          <div id="notifBellContainer"></div>
          <button class="btn btn-sm btn-outline-secondary" id="markAllReadBtn">
            <i class="bi bi-check2-all me-1"></i>Mark All Read
          </button>
        </div>
      </header>

      <main class="p-4">
        <!-- Summary strip -->
        <div class="row g-3 mb-4">
          <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center p-3">
              <h4 class="fw-bold text-primary mb-0" id="totalNotifCount">—</h4>
              <small class="text-muted">Total</small>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center p-3">
              <h4 class="fw-bold text-danger mb-0" id="unreadNotifCount">—</h4>
              <small class="text-muted">Unread</small>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center p-3">
              <h4 class="fw-bold text-success mb-0" id="readNotifCount">—</h4>
              <small class="text-muted">Read</small>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center p-3 d-flex flex-row align-items-center justify-content-center gap-2">
              <button class="btn btn-sm btn-outline-danger w-100" id="clearAllBtn">
                <i class="bi bi-trash me-1"></i>Clear All
              </button>
            </div>
          </div>
        </div>

        <!-- Notification list -->
        <div class="row justify-content-center">
          <div class="col-lg-9">
            <div id="notificationsList">
              <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/notifications.js"></script>
  <script>
  // Wire up summary counts and Clear All
  document.addEventListener('DOMContentLoaded', async () => {
    // Update summary strip after notifications load
    const origLoad = window.loadNotificationsPage;
    const patchSummary = async () => {
      try {
        const { data, unread } = await apiRequest('/notifications');
        document.getElementById('totalNotifCount').textContent  = data.length;
        document.getElementById('unreadNotifCount').textContent = unread;
        document.getElementById('readNotifCount').textContent   = data.length - unread;
        // sidebar badge
        const sb = document.getElementById('sidebarNotifBadge');
        if (sb) { sb.textContent = unread; sb.style.display = unread > 0 ? '' : 'none'; }
      } catch (_) {}
    };
    await patchSummary();
    // Re-patch after each load
    document.getElementById('filterUnread')?.addEventListener('change', patchSummary);
    document.getElementById('markAllReadBtn')?.addEventListener('change', patchSummary);

    // Clear All
    document.getElementById('clearAllBtn')?.addEventListener('click', async () => {
      if (!confirm('Delete all notifications? This cannot be undone.')) return;
      try {
        const { data } = await apiRequest('/notifications');
        await Promise.all(data.map(n => apiRequest(`/notifications/${n.id}`, { method: 'DELETE' })));
        showToast('All notifications cleared.', 'success');
        await loadNotificationsPage();
        await patchSummary();
      } catch (err) { showToast(err.message, 'danger'); }
    });
  });
  </script>
</body>
</html>
