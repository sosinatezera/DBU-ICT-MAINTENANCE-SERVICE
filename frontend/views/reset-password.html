<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Smart ICT Maintenance Management System</title>
</head>
<body>
  <!-- Password reset is handled by the single-page flow at
       /views/forgot-password.html (Email → Verify Code → New Password).

       This legacy page used to read a reset token from the URL (?token=...).
       Reset-authorization tokens are never placed in URLs (they are opaque,
       single-use, and travel only through the JSON body / HttpOnly cookie),
       so this page is now a plain redirect and contains no token handling. -->
  <noscript>
    <p>Password reset is handled on the <a href="forgot-password.html">forgot-password</a> page.</p>
  </noscript>
  <script>window.location.replace( 'forgot-password.html' );</script>
</body>
</html>
