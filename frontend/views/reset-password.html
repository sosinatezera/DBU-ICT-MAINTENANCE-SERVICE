<!DOCTYPE html>
<html lang="en">
<script>(function(){try{if(localStorage.getItem('theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
<script>(function(){try{var l=localStorage.getItem('ict_lang');if(l==='am'||l==='en'){document.documentElement.setAttribute('lang',l);}}catch(e){}})();</script>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Smart Computer Maintenance Service</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <style>
    /* Password strength meter (scoped to this page) */
    #strengthBars .strength-bar {
      flex: 1;
      height: 4px;
      border-radius: 999px;
      background: var(--bs-secondary-bg, #e9ecef);
      transition: background .2s ease;
    }
  </style>
  <script src="/assets/js/api-config.js"></script>
</head>
<body class="auth-body">

<div class="min-vh-100 d-flex align-items-center justify-content-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-6 col-lg-5 col-xl-4">

        <div class="card shadow-lg">
          <div class="card-body p-4 p-md-5">

            <!-- Logo -->
            <div class="text-center mb-4">
              <div class="d-inline-flex align-items-center justify-content-center mb-3"
                   style="width:72px;height:72px;background:linear-gradient(135deg,#2563eb,#0a2540);border-radius:18px;box-shadow:0 6px 20px rgba(37,99,235,.35);">
                <svg xmlns="http://www.w3.org/2000/svg" width="42" height="42" viewBox="0 0 64 64" fill="none">
                  <rect x="10" y="12" width="44" height="30" rx="3" fill="#fff" fill-opacity=".2" stroke="#fff" stroke-width="2"/>
                  <rect x="14" y="16" width="36" height="22" rx="2" fill="#fff" fill-opacity=".9"/>
                  <circle cx="32" cy="27" r="6" fill="#2563eb"/>
                  <circle cx="32" cy="27" r="3" fill="#fff"/>
                  <rect x="30.5" y="19" width="3" height="3" rx="1" fill="#2563eb"/>
                  <rect x="30.5" y="33" width="3" height="3" rx="1" fill="#2563eb"/>
                  <rect x="19" y="25.5" width="3" height="3" rx="1" fill="#2563eb"/>
                  <rect x="42" y="25.5" width="3" height="3" rx="1" fill="#2563eb"/>
                  <rect x="28" y="42" width="8" height="5" rx="1" fill="#fff" fill-opacity=".7"/>
                  <rect x="22" y="47" width="20" height="3" rx="1.5" fill="#fff" fill-opacity=".7"/>
                  <path d="M44 46 L50 52 M44 46 C42 44 42 41 44 39 C46 37 49 37 51 39 L48 42 L46 40 L44 42 L46 44 Z" stroke="#fff" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                  <circle cx="14" cy="56" r="2" fill="#4ade80"/>
                  <circle cx="20" cy="56" r="2" fill="#4ade80" opacity=".7"/>
                  <circle cx="26" cy="56" r="2" fill="#fff" opacity=".4"/>
                </svg>
              </div>
              <h4 class="fw-bold mb-1"><span data-i18n="reset.title">Reset Password</span></h4>
              <p class="text-muted small mb-0"><span data-i18n="reset.subtitle">Choose a strong new password for your account.</span></p>
            </div>

            <!-- Alert -->
            <div id="resetAlert" class="alert d-none mb-3" role="alert"></div>

            <form id="resetForm" novalidate>
              <input type="hidden" id="resetToken" />

              <!-- New Password -->
              <div class="mb-3">
                <label for="newPassword" class="form-label fw-semibold small"><span data-i18n="reset.newPassword">New Password</span> <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock text-muted"></i></span>
                  <input type="password" class="form-control" id="newPassword"
                         placeholder="Enter a new password" data-i18n-placeholder="reset.newPassword.placeholder"
                         autocomplete="new-password" required minlength="8" maxlength="100" />
                  <button class="btn btn-outline-secondary" type="button" id="togglePwd">
                    <i class="bi bi-eye" id="eyeIcon"></i>
                  </button>
                </div>
                <div class="mt-2">
                  <div class="d-flex gap-1 mb-1" id="strengthBars" aria-hidden="true">
                    <span class="strength-bar"></span>
                    <span class="strength-bar"></span>
                    <span class="strength-bar"></span>
                    <span class="strength-bar"></span>
                  </div>
                  <div class="small" id="strengthText"></div>
                </div>
                <div class="form-text"><span data-i18n="reset.hint">At least 8 characters with both letters and numbers.</span></div>
              </div>

              <!-- Confirm Password -->
              <div class="mb-4">
                <label for="confirmPassword" class="form-label fw-semibold small"><span data-i18n="forgot.confirmPassword">Confirm New Password</span> <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock-fill text-muted"></i></span>
                  <input type="password" class="form-control" id="confirmPassword"
                         placeholder="Confirm your new password" data-i18n-placeholder="reset.confirm.placeholder"
                         autocomplete="new-password" required />
                  <button class="btn btn-outline-secondary" type="button" id="toggleConfirm">
                    <i class="bi bi-eye" id="confirmEyeIcon"></i>
                  </button>
                </div>
              </div>

              <!-- Submit -->
              <button type="submit" class="btn btn-primary w-100 py-2" id="resetBtn">
                <span id="resetSpinner" class="spinner-border spinner-border-sm me-2 d-none"></span>
                <i class="bi bi-shield-lock me-1" id="resetIcon"></i>
                <span id="resetBtnText" data-i18n="forgot.reset">Reset Password</span>
              </button>

            </form>

            <hr class="my-4" />
            <p class="text-center text-muted small mb-0">
              <a href="login.html" class="text-primary fw-semibold text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i><span data-i18n="forgot.backLogin">Back to Login</span>
              </a>
            </p>

          </div>
        </div>

        <footer class="auth-footer">
          <a href="index.html" class="back-home">
            <i class="bi bi-arrow-left"></i><span data-i18n="auth.backhome">Back to Home</span>
          </a>
        </footer>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/validation.js?v=6"></script>
<script>
/* API base comes from the shared api-config.js (single source of truth). */
const API = typeof API_BASE === 'string' ? API_BASE : 'http://localhost:5000/api';

const PASSWORD_REGEX = window.VAL.PASSWORD_REGEX;

function showAlert(msg, type) {
  const el    = document.getElementById('resetAlert');
  const icons = {
    success: 'bi-check-circle-fill',
    danger:  'bi-exclamation-triangle-fill',
    warning: 'bi-exclamation-triangle-fill',
    info:    'bi-info-circle-fill',
  };
  el.className = `alert alert-${type} d-flex align-items-center gap-2`;
  el.innerHTML = `<i class="bi ${icons[type] || 'bi-info-circle-fill'} flex-shrink-0"></i><span>${msg}</span>`;
  el.classList.remove('d-none');
}

function setLoading(on) {
  document.getElementById('resetBtn').disabled = on;
  document.getElementById('resetSpinner').classList.toggle('d-none', !on);
  document.getElementById('resetIcon').classList.toggle('d-none', on);
  const text = on
    ? (window.t ? t('forgot.resetting') : 'Resetting...')
    : (window.t ? t('forgot.reset') : 'Reset Password');
  document.getElementById('resetBtnText').textContent = text;
}

/* ── Password strength meter ─────────────────────────────── */
function scorePassword(pw) {
  let score = 0;
  if (pw.length >= 8)                      score++;
  if (pw.length >= 12)                     score++;
  if (/[A-Za-z]/.test(pw) && /\d/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw))             score++;
  return score; /* 0..4 */
}

function updateStrength() {
  const pw   = document.getElementById('newPassword').value;
  const bars = document.querySelectorAll('#strengthBars .strength-bar');
  const text = document.getElementById('strengthText');

  let msg = '', colour = 'var(--bs-secondary)', filled = 0;

  if (!pw) {
    msg    = (window.t ? t('reset.strength.none') : 'Enter a password');
    colour = 'var(--bs-secondary)';
  } else if (pw.length < 8) {
    msg    = (window.t ? t('reset.strength.tooshort') : 'Too short');
    colour = '#dc3545';
    filled = 1;
  } else {
    const s = scorePassword(pw); /* 1..4 */
    filled  = s;
    msg     = window.t ? t(`reset.strength.${s}`) : ['', 'Very weak', 'Weak', 'Fair', 'Strong', 'Very strong'][s];
    colour  = ['', '#dc3545', '#fd7e14', '#ffc107', '#0dcaf0', '#198754'][s];
  }

  bars.forEach((bar, i) => {
    bar.style.background = i < filled ? colour : 'var(--bs-secondary-bg, #e9ecef)';
  });
  text.textContent          = msg;
  text.style.color          = colour;
  text.style.fontWeight     = 600;
}

/* ── Visibility toggles ─────────────────────────────────── */
function bindToggle(id, eyeId) {
  const btn = document.getElementById(id);
  const pwd = btn.previousElementSibling; /* the input inside the input-group */
  const eye = document.getElementById(eyeId);
  if (!btn || !eye || !pwd) return;
  btn.addEventListener('click', () => {
    const show = pwd.type === 'password';
    pwd.type       = show ? 'text' : 'password';
    eye.className  = show ? 'bi bi-eye-slash' : 'bi bi-eye';
  });
}

/* Confirm-password live match */
document.getElementById('confirmPassword').addEventListener('input', () => {
  const pwd     = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  if (confirm && pwd !== confirm) {
    showFieldError('confirmPassword', (window.t ? t('reset.mismatch') : 'Passwords do not match.'));
  } else if (confirm) {
    showFieldValid('confirmPassword');
  } else {
    clearFieldValidation('confirmPassword');
  }
});

/* Real-time validation */
attachRealTimeValidation('resetForm', [
  { fieldId: 'newPassword', checks: [Validators.password] },
  { fieldId: 'confirmPassword', checks: [v => Validators.passwordMatch(document.getElementById('newPassword').value, v)] },
]);

document.getElementById('newPassword').addEventListener('input', () => {
  updateStrength();
  const c = document.getElementById('confirmPassword');
  if (c.value && c.value !== document.getElementById('newPassword').value) showFieldError('confirmPassword', (window.t ? t('reset.mismatch') : 'Passwords do not match.'));
});

/* ── Initialise ─────────────────────────────────────────── */
(function init() {
  bindToggle('togglePwd', 'eyeIcon');
  bindToggle('toggleConfirm', 'confirmEyeIcon');
  updateStrength();

  /* Capture the token from the URL and hide it from the page (single-use). */
  const params = new URLSearchParams(window.location.search);
  const token  = params.get('token') || '';
  document.getElementById('resetToken').value = token;

  if (!token) {
    showAlert(window.t ? t('reset.missingToken') : 'This password reset link is invalid or incomplete. Please request a new reset link.', 'danger');
    document.getElementById('resetBtn').disabled = true;
  }
})();

/* ── Form submit ────────────────────────────────────────── */
document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  document.getElementById('resetAlert').classList.add('d-none');

  const token = document.getElementById('resetToken').value;
  if (!token) {
    showAlert(window.t ? t('reset.missingToken') : 'This password reset link is invalid or incomplete. Please request a new reset link.', 'danger');
    return;
  }

  const password      = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  const pwErr = Validators.password(password);
  if (pwErr) { showFieldError('newPassword', pwErr); return; }
  else { showFieldValid('newPassword'); }

  const matchErr = Validators.passwordMatch(password, confirmPassword);
  if (matchErr) { showFieldError('confirmPassword', matchErr); return; }
  else { showFieldValid('confirmPassword'); }

  setLoading(true);
  let res;
  try {
    res = await fetch(`${API}/auth/reset-password`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ token, password }),
    });
  } catch {
    showAlert('Cannot connect to server. Make sure the backend is running on port 5000.', 'warning');
    setLoading(false);
    return;
  }

  const data = await res.json().catch(() => ({}));

  if (!res.ok) {
    showAlert(data.message || 'Reset failed. Please try again.', 'danger');
    setLoading(false);
    return;
  }

  showAlert(data.message || (window.t ? t('reset.success') : 'Your password has been reset. You can now sign in.'), 'success');
  document.getElementById('resetForm').reset();
  updateStrength();

  /* Kill any stale session so the user must sign in with the new password. */
  localStorage.removeItem('ict_token');
  localStorage.removeItem('ict_user');

  setTimeout(() => { window.location.href = 'login.html'; }, 2500);
});
</script>
<script src="/assets/js/theme.js"></script>
<script src="/assets/js/lang.js"></script>
</body>
</html>
