<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — Technician</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/technician.css" />
  <style>
    .notif-item { transition: background .15s; }
    .notif-item:hover { background: #f8f9fa !important; }
  </style>
</head>
<body class="dashboard-body">

  <div class="d-flex">
    <!-- ── Sidebar ── -->
    <nav id="sidebar" class="sidebar bg-dark text-white d-flex flex-column p-3" style="min-height:100vh;width:245px;flex-shrink:0;">
      <a href="../index.html" class="text-decoration-none">
        <div class="text-center mb-4">
          <i class="bi bi-wrench-adjustable fs-2 text-warning"></i>
          <div class="fw-bold small mt-1">Technician Panel</div>
        </div>
      </a>
      <ul class="nav flex-column gap-1">
        <li><a href="dashboard.html"        class="nav-link text-white-50"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
        <li><a href="assigned-requests.html" class="nav-link text-white-50"><i class="bi bi-list-task me-2"></i>Assigned Requests</a></li>
        <li><a href="maintenance.html"       class="nav-link text-white-50"><i class="bi bi-tools me-2"></i>Log Activity</a></li>
        <li><a href="history.html"           class="nav-link text-white-50"><i class="bi bi-clock-history me-2"></i>History</a></li>
        <li><a href="notifications.html"     class="nav-link text-white active bg-white bg-opacity-25 rounded">
          <i class="bi bi-bell me-2"></i>Notifications
          <span class="badge bg-danger ms-1" id="sidebarNotifBadge" style="display:none;"></span>
        </a></li>
      </ul>
      <div class="mt-auto pt-3 border-top border-white border-opacity-25">
        <div class="d-flex align-items-center gap-2 mb-3">
          <div class="rounded-circle bg-warning d-flex align-items-center justify-content-center text-dark fw-bold flex-shrink-0"
               style="width:36px;height:36px;" id="avatarInitial">T</div>
          <div style="overflow:hidden;">
            <div class="small fw-semibold text-white text-truncate" id="sidebarUserName">Technician</div>
            <div class="text-white-50" style="font-size:.7rem;" id="sidebarSpec">—</div>
          </div>
        </div>
        <a href="#" class="nav-link text-white-50 small" id="logoutBtn">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </a>
      </div>
    </nav>

    <!-- ── Main ── -->
    <div class="flex-grow-1">
      <header class="topbar bg-white border-bottom px-4 py-3 d-flex justify-content-between align-items-center shadow-sm">
        <div>
          <h5 class="mb-0 fw-bold"><i class="bi bi-bell text-warning me-2"></i>Notifications</h5>
          <small class="text-muted" id="unreadCount"></small>
        </div>
        <div class="d-flex align-items-center gap-2">
          <div class="form-check form-switch mb-0 me-2">
            <input class="form-check-input" type="checkbox" id="filterUnread" />
            <label class="form-check-label small text-muted" for="filterUnread">Unread only</label>
          </div>
          <div id="notifBellContainer"></div>
          <button class="btn btn-sm btn-outline-secondary" id="markAllReadBtn">
            <i class="bi bi-check2-all me-1"></i>Mark All Read
          </button>
        </div>
      </header>

      <main class="p-4">
        <!-- Summary strip -->
        <div class="row g-3 mb-4">
          <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center p-3">
              <h4 class="fw-bold text-primary mb-0" id="totalNotifCount">—</h4>
              <small class="text-muted">Total</small>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center p-3">
              <h4 class="fw-bold text-danger mb-0" id="unreadNotifCount">—</h4>
              <small class="text-muted">Unread</small>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center p-3">
              <h4 class="fw-bold text-success mb-0" id="readNotifCount">—</h4>
              <small class="text-muted">Read</small>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm text-center p-3">
              <button class="btn btn-sm btn-outline-danger w-100" id="clearAllBtn">
                <i class="bi bi-trash me-1"></i>Clear All
              </button>
            </div>
          </div>
        </div>

        <!-- Notification list -->
        <div class="row justify-content-center">
          <div class="col-lg-9">
            <div id="notificationsList">
              <div class="text-center py-5">
                <div class="spinner-border text-warning" role="status"></div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/notifications.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', async () => {
    // Populate sidebar avatar initial and spec
    try {
      const user = Auth.getUser();
      if (user) {
        const initial = (user.fullName || 'T').charAt(0).toUpperCase();
        const avatarEl = document.getElementById('avatarInitial');
        if (avatarEl) avatarEl.textContent = initial;
      }
      const { data: techs } = await apiRequest('/technicians');
      const myTech = techs.find(t => t.fullName === Auth.getUser()?.fullName);
      if (myTech) document.getElementById('sidebarSpec').textContent = myTech.specialization || 'ICT Support';
    } catch (_) {}

    // Update summary strip
    const patchSummary = async () => {
      try {
        const { data, unread } = await apiRequest('/notifications');
        document.getElementById('totalNotifCount').textContent  = data.length;
        document.getElementById('unreadNotifCount').textContent = unread;
        document.getElementById('readNotifCount').textContent   = data.length - unread;
        const sb = document.getElementById('sidebarNotifBadge');
        if (sb) { sb.textContent = unread; sb.style.display = unread > 0 ? '' : 'none'; }
      } catch (_) {}
    };
    await patchSummary();
    document.getElementById('filterUnread')?.addEventListener('change', patchSummary);

    // Clear All
    document.getElementById('clearAllBtn')?.addEventListener('click', async () => {
      if (!confirm('Delete all notifications? This cannot be undone.')) return;
      try {
        const { data } = await apiRequest('/notifications');
        await Promise.all(data.map(n => apiRequest(`/notifications/${n.id}`, { method: 'DELETE' })));
        showToast('All notifications cleared.', 'success');
        await loadNotificationsPage();
        await patchSummary();
      } catch (err) { showToast(err.message, 'danger'); }
    });
  });
  </script>
</body>
</html>
