<!DOCTYPE html>
<html lang="en">
<script>(function(){try{var l=localStorage.getItem('ict_lang');if(l==='am'||l==='en'){document.documentElement.setAttribute('lang',l);}}catch(e){}})();</script>
<script>(function(){try{if(localStorage.getItem('theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assigned Requests — Smart Computer Maintenance Service</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/technician.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
<link rel="stylesheet" href="/assets/css/theme.css" />
</head>
<body class="dashboard-body">

  <div class="d-flex">
    <nav id="sidebar" class="sidebar bg-dark text-white d-flex flex-column p-3" style="min-height:100vh;width:240px;">
      <a href="../index.html" class="text-decoration-none">
        <div class="sidebar-brand mb-4 text-center">
          <i class="bi bi-wrench-adjustable fs-3 text-warning"></i>
          <div class="small fw-bold mt-1">Technician Panel</div>
        </div>
      </a>
      <ul class="nav flex-column gap-1">
        <li><a href="dashboard.html"         class="nav-link text-white-50"><i class="bi bi-speedometer2 me-2"></i><span data-i18n="side.dashboard">Dashboard</span></a></li>
        <li><a href="assigned-requests.html"  class="nav-link text-white active bg-white bg-opacity-25 rounded"><i class="bi bi-list-task me-2"></i><span data-i18n="side.assigned">Assigned Requests</span></a></li>
        <li><a href="maintenance.html"        class="nav-link text-white-50"><i class="bi bi-tools me-2"></i><span data-i18n="side.maintenance">Maintenance Activity</span></a></li>
        <li><a href="history.html"            class="nav-link text-white-50"><i class="bi bi-clock-history me-2"></i><span data-i18n="side.history">History</span></a></li>
        <li><a href="technician-feedback.html" class="nav-link text-white-50"><i class="bi bi-chat-dots me-2"></i><span data-i18n="side.feedback">Feedback</span></a></li>
        <li><a href="notifications.html"      class="nav-link text-white-50"><i class="bi bi-bell me-2"></i><span data-i18n="side.notifications">Notifications</span></a></li>
        <li><a href="profile.html" class="nav-link text-white-50" id="profileNavLink"><i
              class="bi bi-person-circle me-2"></i><span data-i18n="side.profile">My Profile</span></a></li>
      </ul>
      <div class="mt-auto pt-3 border-top border-white border-opacity-25">
        <div class="d-flex align-items-center gap-2 mb-2">
          <i class="bi bi-person-circle fs-5"></i>
          <span class="small" id="sidebarUserName" class="text-white-50"></span>
        </div>
        <a href="#" class="nav-link text-white-50 small" id="logoutBtn"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
      </div>
    </nav>

    <div class="flex-grow-1">
      <header class="topbar bg-white border-bottom px-4 py-3 d-flex justify-content-between align-items-center shadow-sm">
        <h5 class="mb-0 fw-bold">Assigned Requests</h5>
        <div class="d-flex align-items-center gap-2">
          <div id="notifBellContainer"></div>
          <span class="text-muted small d-none d-md-block" id="topUserName"></span>
        </div>
      </header>

      <main class="p-4">
        <!-- Filter Bar -->
        <div class="card border-0 shadow-sm mb-4">
          <div class="card-body p-3">
            <div class="row g-2 align-items-end">
              <div class="col-md-4">
                <label class="form-label small fw-semibold">Search</label>
                <input type="text" class="form-control" id="searchInput" placeholder="Search by title..." />
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-semibold">Status</label>
                <select class="form-select" id="statusFilter">
                  <option value="">All</option>
                  <option value="assigned">Assigned</option>
                  <option value="accepted">Accepted</option>
                  <option value="in_progress">In Progress</option>
                  <option value="resolved">Resolved</option>
                  <option value="closed">Closed</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-semibold">Priority</label>
                <select class="form-select" id="priorityFilter">
                  <option value="">All</option>
                  <option value="critical">Critical</option>
                  <option value="high">High</option>
                  <option value="medium">Medium</option>
                  <option value="low">Low</option>
                </select>
              </div>
              <div class="col-md-2">
                <button class="btn btn-primary w-100" id="filterBtn">
                  <i class="bi bi-funnel me-1"></i>Filter
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Requests Cards -->
        <div id="assignedRequestsList" class="row g-3">
          <div class="col-12 text-center text-muted py-5">
            <i class="bi bi-list-task fs-1 d-block mb-2"></i>Loading assigned requests...
          </div>
        </div>

        <!-- Task Detail & Update Modal -->
        <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
          <div class="modal-dialog modal-lg">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title fw-bold" id="taskModalLabel">Task Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <!-- Task Info -->
                <div id="taskInfoSection" class="mb-4"></div>

                <hr />

                <!-- Update Status -->
                <h6 class="fw-semibold mb-3">Update Status</h6>
                <div id="taskUpdateAlert" class="alert d-none" role="alert"></div>
                <form id="taskUpdateForm">
                  <input type="hidden" id="taskRequestId" />
                  <div class="row g-3 mb-3">
                    <div class="col-md-6">
                      <label for="newStatus" class="form-label fw-semibold">New Status</label>
                      <select class="form-select" id="newStatus" required>
                        <option value="">-- Select Status --</option>
                        <option value="in_progress">Mark In Progress</option>
                        <option value="resolved">Mark Resolved</option>
                      </select>
                    </div>
                  </div>
                  <div class="mb-3">
                    <label for="actionTaken" class="form-label fw-semibold">Action Taken <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="actionTaken" rows="3"
                              placeholder="Describe what was done..." required></textarea>
                  </div>
                  <div class="mb-3">
                    <label for="partsUsed" class="form-label fw-semibold">Parts / Materials Used</label>
                    <input type="text" class="form-control" id="partsUsed"
                           placeholder="e.g. RAM Module 8GB, HDMI Cable" />
                  </div>
                  <div class="mb-3">
                    <label for="techNotes" class="form-label fw-semibold">Notes</label>
                    <textarea class="form-control" id="techNotes" rows="2"
                              placeholder="Additional notes..."></textarea>
                  </div>
                </form>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-warning" id="saveTaskUpdateBtn">
                  <span class="spinner-border spinner-border-sm me-2 d-none" id="saveTaskSpinner"></span>
                  <i class="bi bi-save me-1"></i>Save Update
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Maintenance Report Modal (Add / Edit) -->
        <div class="modal fade" id="feedbackModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-lg">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title fw-bold" id="feedbackModalLabel">Maintenance Report</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body" style="max-height:90vh;overflow-y:auto;">
                <div id="feedbackTaskInfo" class="mb-3 p-3 bg-light rounded"></div>
                <div id="feedbackAlert" class="alert d-none"></div>
                <input type="hidden" id="feedbackRequestId" />
                <div class="row g-3">
                  <div class="col-12">
                    <label class="form-label fw-semibold small">Diagnosis / Identified Problem <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="fbDiagnosis" rows="2" maxlength="2000" placeholder="What was the root cause?"></textarea>
                  </div>
                  <div class="col-12">
                    <label class="form-label fw-semibold small">Work Performed <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="fbWorkPerformed" rows="3" maxlength="2000" placeholder="Describe the work carried out..."></textarea>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold small">Parts / Materials Used</label>
                    <input type="text" class="form-control" id="fbPartsUsed" maxlength="500" placeholder="e.g. RAM 8GB, HDMI Cable" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold small">Maintenance Status <span class="text-danger">*</span></label>
                    <select class="form-select" id="fbStatus">
                      <option value="Fixed">Fixed</option>
                      <option value="In Progress">In Progress</option>
                      <option value="Not Fixed">Not Fixed</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <label class="form-label fw-semibold small">Resolution Summary <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="fbResolution" rows="2" maxlength="1000" placeholder="Short summary shown to the requester..."></textarea>
                  </div>
                  <div class="col-12 d-none" id="fbReasonWrap">
                    <label class="form-label fw-semibold small">Reason Not Fixed <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="fbReasonNotFixed" rows="2" maxlength="1000" placeholder="Explain why the issue could not be fixed..."></textarea>
                  </div>
                  <div class="col-12">
                    <label class="form-label fw-semibold small">Recommendation</label>
                    <textarea class="form-control" id="fbRecommendation" rows="2" maxlength="1000" placeholder="Recommended next steps..."></textarea>
                  </div>
                  <div class="col-12">
                    <label class="form-label fw-semibold small">Technician Notes (internal only)</label>
                    <textarea class="form-control" id="fbTechnicianNotes" rows="2" maxlength="2000" placeholder="Notes visible only to technicians and admins..."></textarea>
                  </div>
                  <div class="col-12">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="fbConfirmed" />
                      <label class="form-check-label small" for="fbConfirmed">
                        I confirm that this report accurately reflects the work performed. <span class="text-danger">*</span>
                      </label>
                    </div>
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary px-4" id="saveFeedbackBtn">
                  <span class="spinner-border spinner-border-sm me-2 d-none" id="saveFeedbackSpinner"></span>
                  <i class="bi bi-wrench-adjustable me-1"></i>Submit Maintenance Report
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- View Maintenance Report Modal -->
        <div class="modal fade" id="viewReportModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-lg">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title fw-bold">Maintenance Report</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body" id="viewReportBody">
                <div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div></div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
              </div>
            </div>
          </div>
        </div>

        <!-- View Ticket Details Modal -->
        <div class="modal fade" id="viewTicketModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title fw-bold">Request Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body" id="viewTicketBody">
                <div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
              </div>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api-config.js"></script>
  <script src="/assets/js/main.js?v=7"></script>
  <script src="/assets/js/notifications.js?v=6"></script>
  <script src="/assets/js/technicians.js?v=7"></script>
  <script src="/assets/js/theme.js"></script>
</body>
</html>
