<!DOCTYPE html>
<html lang="en">
<script>( function () { try { if ( localStorage.getItem( 'theme' ) === 'dark' ) { document.documentElement.setAttribute( 'data-theme', 'dark' ); } } catch ( e ) { } } )();</script>
<script>window.__hideLangSwitch = true; ( function () { try { var l = localStorage.getItem( 'ict_lang' ); if ( l === 'am' || l === 'en' || l === 'om' ) { document.documentElement.setAttribute( 'lang', l ); } } catch ( e ) { } } )();</script>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="page.login">Login — Smart ICT Maintenance Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/assets/css/responsive.css" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <script src="/assets/js/api-config.js?v=4"></script>
</head>

<body class="auth-body">

  <div class="min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-sm-10 col-md-6 col-lg-5 col-xl-4">

          <div class="card shadow-lg">
            <div class="card-body p-4 p-md-5">

              <!-- Logo -->
              <div class="text-center mb-4">
                <img src="/assets/images/mau_logo.jpg" alt=""
                  style="width:110px;height:110px;object-fit:contain;display:block;margin:0 auto 20px;" />
                <h4 class="fw-bold mb-1"><span data-i18n="auth.brand">Smart ICT Maintenance Management System</span>
                </h4>
                <p class="text-muted small mb-0"><span data-i18n="auth.login.head">Sign in to your account</span></p>
              </div>

              <!-- Alert -->
              <div id="loginAlert" class="alert d-none mb-3" role="alert"></div>

              <form id="loginForm">

                <!-- Email -->
                <div class="mb-3">
                  <label for="email" class="form-label fw-semibold small"><span data-i18n="auth.form.email">Email
                      Address</span></label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email address"
                      data-i18n-placeholder="auth.form.email.placeholder" autocomplete="email" required />
                  </div>
                </div>

                <!-- Password -->
                <div class="mb-4">
                  <label for="password" class="form-label fw-semibold small"><span
                      data-i18n="auth.form.password">Password</span></label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password"
                      data-i18n-placeholder="auth.form.password.placeholder" autocomplete="current-password" required />
                    <button class="btn btn-outline-secondary" type="button" id="togglePwd">
                      <i class="bi bi-eye" id="eyeIcon"></i>
                    </button>
                  </div>
                </div>

                <!-- Remember me -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe" />
                    <label class="form-check-label small text-muted" for="rememberMe"><span
                        data-i18n="auth.remember">Remember me</span></label>
                  </div>
                  <a href="forgot-password.html" class="small text-primary text-decoration-none"><span
                      data-i18n="auth.forgot">Forgot password?</span></a>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                  <span id="loginSpinner" class="spinner-border spinner-border-sm me-2 d-none"></span>
                  <i class="bi bi-box-arrow-in-right me-1" id="loginIcon"></i>
                  <span id="loginBtnText" data-i18n="auth.login.btn">Sign In</span>
                </button>

              </form>

              <hr class="my-4" />
              <p class="text-center text-muted small mb-0">
                <span data-i18n="auth.noaccount">Don't have an account?</span>
                <a href="register.html" class="text-primary fw-semibold text-decoration-none"><span
                    data-i18n="auth.registerhere">Register here</span></a>
              </p>

            </div>
          </div>

          <footer class="auth-footer">
            <a href="/" class="back-home">
              <i class="bi bi-arrow-left"></i><span data-i18n="auth.backhome">Back to Home</span>
            </a>
          </footer>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/validation.js?v=7"></script>
  <script>
    /* Auto-redirect only when the server confirms the current session. */
    ( async function ()
    {
      const controller = new AbortController();
      const timer = setTimeout( () => controller.abort(), 15000 );
      try
      {
        const res = await fetch( `${ API_BASE }/auth/me`, {
          credentials: 'include',
          signal: controller.signal,
        } );
        const data = await res.json().catch( () => ( {} ) );
        if ( res.ok && data.user ) redirectByRole( data.user.role );
      } catch ( _ ) { }
      finally
      {
        clearTimeout( timer );
      }
    } )();

    function redirectByRole ( role )
    {
      const routes = {
        'ICT Admin': '/views/admin/dashboard.html',
        'Requester': '/views/user/dashboard.html',
        'Technician': '/views/technician/dashboard.html',
      };
      window.location.href = routes[role] || '/views/user/dashboard.html';
    }

    function showAlert ( msg, type )
    {
      const el = document.getElementById( 'loginAlert' );
      const icons = {
        success: 'bi-check-circle-fill',
        danger: 'bi-exclamation-triangle-fill',
        warning: 'bi-exclamation-triangle-fill',
        info: 'bi-info-circle-fill',
      };
      el.className = `alert alert-${ type } d-flex align-items-center gap-2`;
      el.innerHTML = `<i class="bi ${ icons[type] || 'bi-info-circle-fill' } flex-shrink-0"></i><span>${ msg }</span>`;
      el.classList.remove( 'd-none' );
    }

    function setLoading ( on )
    {
      document.getElementById( 'loginBtn' ).disabled = on;
      document.getElementById( 'loginSpinner' ).classList.toggle( 'd-none', !on );
      document.getElementById( 'loginIcon' ).classList.toggle( 'd-none', on );
      document.getElementById( 'loginBtnText' ).textContent = on ? ( window.t ? t( 'auth.login.signing' ) : 'Signing in...' ) : ( window.t ? t( 'auth.login.btn' ) : 'Sign In' );
    }

    /* Real-time field validation */
    attachRealTimeValidation( 'loginForm', [
      { fieldId: 'email', checks: [Validators.email] },
    ] );

    /* Form submit */
    document.getElementById( 'loginForm' ).addEventListener( 'submit', async ( e ) =>
    {
      e.preventDefault();
      document.getElementById( 'loginAlert' ).classList.add( 'd-none' );

      const email = document.getElementById( 'email' ).value.trim();
      const password = document.getElementById( 'password' ).value;

      /* Validate fields */
      let hasError = false;

      const emailErr = Validators.email( email );
      if ( emailErr ) { showFieldError( 'email', emailErr ); hasError = true; }
      else { showFieldValid( 'email' ); }

      if ( !password )
      {
        showFieldError( 'password', 'Password is required.' );
        hasError = true;
      } else { clearFieldValidation( 'password' ); }

      if ( hasError ) return;

      setLoading( true );
      let res;
      let data;
      const controller = new AbortController();
      /* Netlify -> Render is cross-origin (POST triggers a CORS preflight) and
         Render's FREE tier cold-starts sleeping instances in 30-60s. 15s was
         too short: a waking instance aborted here and the raw error was
         indistinguishable from a CORS/network block. 30s still bounds the wait
         without letting a hung request spin forever. */
      const timer = setTimeout( () => controller.abort(), 30000 );
      try
      {
        res = await fetch( `${ API_BASE }/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify( { email, password } ),
          signal: controller.signal,
        } );
        const raw = await res.text();
        try { data = raw ? JSON.parse( raw ) : {}; }
        catch ( _ ) { data = {}; }
      } catch ( err )
      {
        /* The ONLY abort source here is the timer above, so AbortError means
           the request exceeded the budget (cold start / slow provider), not a
           browser CORS block. Everything else is a transport failure — for
           cross-origin requests that is almost always CORS (the deployment
           does not allow Origin: https://simms-mau.netlify.app). */
        if ( err && err.name === 'AbortError' )
        {
          showAlert( 'The server took too long to respond — the free-tier backend may still be waking up. Please try again in a moment.', 'warning' );
        } else
        {
          showAlert( 'The server did not respond. This is usually a connection (CORS) problem — check the browser Network tab for the /api/auth/login request.', 'danger' );
        }
        setLoading( false );
        return;
      } finally
      {
        clearTimeout( timer );
      }

      if ( !res.ok )
      {
        showAlert( data.message || 'Invalid email or password.', 'danger' );
        setLoading( false );
        return;
      }

      if ( !data.user )
      {
        showAlert( 'Server responded without user data. Please retry or contact support.', 'warning' );
        setLoading( false );
        return;
      }

      /* Save session — normalize role to canonical format */
      const roleMap = {
        'requester': 'Requester',
        'technician': 'Technician',
        'admin': 'ICT Admin',
        'ict admin': 'ICT Admin',
      };
      const normalizedUser = {
        ...data.user,
        role: roleMap[data.user.role?.toLowerCase()] || data.user.role,
      };
      showAlert( `Welcome, <strong>${ normalizedUser.fullName }</strong>!`, 'success' );
      window.location.href = data.redirect || redirectByRole( normalizedUser.role );
    } );

    /* Password toggle */
    document.getElementById( 'togglePwd' ).addEventListener( 'click', () =>
    {
      const pwd = document.getElementById( 'password' );
      const icon = document.getElementById( 'eyeIcon' );
      const show = pwd.type === 'password';
      pwd.type = show ? 'text' : 'password';
      icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
    } );
  </script>
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/lang.js?v=16"></script>
</body>

</html>
